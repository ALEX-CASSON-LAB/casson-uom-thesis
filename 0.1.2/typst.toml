[package]
name = "casson-uom-thesis"
version = "0.1.2"
entrypoint = "casson-uom-thesis.typ"
authors = ["Alex Casson <https://research.manchester.ac.uk/en/persons/alex.casson>"]
license = "MIT-0"
description = "Typst template based upon The University of Manchester Presentation of Theses Policy which relates to the examination of doctoral and MPhil degrees at The University of Manchester and applies to full-time and part-time postgraduate research students of the following degrees: Doctoral degrees: Doctor of Philosophy (PhD); Doctor of Medicine (MD) Doctor of Business Administration (DBA); Professional, Engineering and Enterprise Doctorates; Master of Philosophy (MPhil). This template has been updated for version 12 of the policy (March 2026). Responsibility for ensuring compliance with the University of Manchester Presentation of Theses Policy remains with the candidate."
repository = "https://github.com/ALEX-CASSON-LAB/uom_phd_thesis_typst_template"
keywords = ["University of Manchester", "UK", "PhD", "thesis", "dissertation"]
categories = ["thesis"]
compiler = "0.14.0"

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"